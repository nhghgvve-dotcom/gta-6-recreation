name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Coastline/**'
      - '.github/workflows/build-windows.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot with Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Download rigged human character models
        run: |
          mkdir -p Coastline/assets/people
          curl -fL https://models.vinish.dev/people/casual-man.glb -o Coastline/assets/people/casual-man.glb
          curl -fL https://models.vinish.dev/people/casual-woman.glb -o Coastline/assets/people/casual-woman.glb
          curl -fL https://models.vinish.dev/people/business-man.glb -o Coastline/assets/people/business-man.glb
          curl -fL https://models.vinish.dev/people/business-woman.glb -o Coastline/assets/people/business-woman.glb
          curl -fL https://models.vinish.dev/people/construction-worker.glb -o Coastline/assets/people/construction-worker.glb
          curl -fL https://models.vinish.dev/people/doctor.glb -o Coastline/assets/people/doctor.glb
          curl -fL https://models.vinish.dev/people/runner-woman.glb -o Coastline/assets/people/runner.glb

      - name: Download and verify detailed CC0 sports car model
        run: |
          mkdir -p Coastline/assets/vehicles
          curl -fL https://grab3d.com/dl/sports-car/sports-car.glb -o Coastline/assets/vehicles/sports-car.glb
          test -s Coastline/assets/vehicles/sports-car.glb
          file Coastline/assets/vehicles/sports-car.glb | grep -qi 'glb\|gltf\|binary'

      - name: Import project resources
        run: godot --headless --editor --path Coastline --quit

      - name: Run headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path Coastline --quit-after 8 2>&1 | tee /tmp/coastline-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/coastline-smoke.log; then
            echo "Godot script errors detected; refusing to export a broken build."
            exit 1
          fi

      - name: Export Windows build
        run: |
          mkdir -p Coastline/build
          godot --headless --path Coastline --export-release "Windows Desktop" "$GITHUB_WORKSPACE/Coastline/build/Coastline.exe"

      - name: Verify exported files
        run: |
          test -s Coastline/build/Coastline.exe
          test -s Coastline/build/Coastline.pck

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Coastline-Windows
          path: |
            Coastline/build/Coastline.exe
            Coastline/build/Coastline.pck
          if-no-files-found: error
