name: Build Coastline Cinematic Trailer

on:
  push:
    paths:
      - ".github/workflows/build-coastline-trailer.yml"
      - "Coastline/**"
      - "trailer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-trailer:
    name: Render Coastline gameplay, animate camera, and make MP4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Coastline
        uses: actions/checkout@v4

      - name: Install Godot rendering dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 fonts-dejavu-core unzip
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Download Coastline character and vehicle assets
        run: |
          set -euo pipefail
          mkdir -p Coastline/assets/people Coastline/assets/vehicles
          curl -fL https://models.vinish.dev/people/casual-man.glb -o Coastline/assets/people/casual-man.glb
          curl -fL https://models.vinish.dev/people/casual-woman.glb -o Coastline/assets/people/casual-woman.glb
          curl -fL https://models.vinish.dev/people/business-man.glb -o Coastline/assets/people/business-man.glb
          curl -fL https://models.vinish.dev/people/business-woman.glb -o Coastline/assets/people/business-woman.glb
          curl -fL https://models.vinish.dev/people/construction-worker.glb -o Coastline/assets/people/construction-worker.glb
          curl -fL https://models.vinish.dev/people/doctor.glb -o Coastline/assets/people/doctor.glb
          curl -fL https://models.vinish.dev/people/runner-woman.glb -o Coastline/assets/people/runner.glb
          curl -fL https://grab3d.com/dl/sports-car/sports-car.glb -o Coastline/assets/vehicles/sports-car.glb
          curl -fL "https://files.innerscene.com/library/police-officer-standing-3d-person-emergency-services-9fd93114/5a54c44f2bfc5920ccd2/professional-police-officer.glb" -o Coastline/assets/people/police-officer.glb
          curl -fL "https://shuriken.studio/models/download/6fb5a1fb-25d8-4fdc-9e4b-a605a39f884c" -o Coastline/assets/vehicles/police-helicopter.glb
          cp Coastline/assets/vehicles/sports-car.glb Coastline/assets/vehicles/police-car.glb
          test -s Coastline/assets/vehicles/police-helicopter.glb
          test -s Coastline/assets/vehicles/sports-car.glb

      - name: Import Coastline assets
        run: |
          "$GODOT_BIN" --headless --path Coastline --editor --quit

      - name: Render 432 separate frames from the actual Coastline game
        run: |
          set -euo pipefail
          mkdir -p trailer/frames
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN"             --path Coastline             --script res://trailer/render_trailer.gd             --xr-mode off             --rendering-method gl_compatibility             --resolution 1280x720
          count=$(find trailer/frames -maxdepth 1 -type f -name 'frame_*.png' | wc -l)
          if [[ "$count" -ne 432 ]]; then
            echo "::error::Expected 432 rendered frames, found $count."
            exit 1
          fi
          echo "FRAME_COUNT=$count" >> "$GITHUB_ENV"

      - name: Generate an original cinematic electronic soundtrack
        run: |
          python3 - <<'PY'
          import math, random, struct, wave
          sample_rate = 44100
          duration = 20.0
          rng = random.Random(41)
          roots = [110.00, 130.81, 98.00, 146.83]
          melody = [440.00, 523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 440.00]
          with wave.open("trailer/audio-generated.wav", "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              chunk = bytearray()
              for i in range(int(sample_rate * duration)):
                  t = i / sample_rate
                  bar = int(t / 1.5) % len(roots)
                  root = roots[bar]
                  fade_in = min(1.0, t / 1.2)
                  fade_out = min(1.0, max(0.0, (duration - t) / 1.3))
                  pad = sum(math.sin(2 * math.pi * root * ratio * t) for ratio in (1, 1.25, 1.5, 2)) * 0.035
                  bass_pulse = max(0.0, math.sin(math.pi * ((t * 2) % 1))) ** 2
                  bass = math.sin(2 * math.pi * (root / 2) * t) * bass_pulse * 0.15
                  note_index = int(t / 0.375) % len(melody)
                  melody_env = min(1.0, (t % 0.375) * 18.0) * max(0.0, 1.0 - ((t % 0.375) / 0.375) ** 2)
                  lead = math.sin(2 * math.pi * melody[note_index] * t) * melody_env * 0.075
                  beat_phase = t % 0.75
                  kick = math.sin(2 * math.pi * (48 + 35 * math.exp(-beat_phase * 18)) * t) * math.exp(-beat_phase * 11) * 0.22
                  rotor = 0.0
                  if t >= 10.0:
                      rotor_phase = (t - 10.0) * 2 * math.pi * 18.0
                      rotor = (max(0.0, math.sin(rotor_phase)) ** 7 - 0.12) * 0.055
                      rotor += math.sin(2 * math.pi * 42.0 * t) * 0.018
                  swell = 0.0
                  for cut in (3.0, 6.0, 9.0):
                      age = t - (cut - 0.7)
                      if 0 <= age <= 0.7:
                          swell += (rng.random() * 2 - 1) * (age / 0.7) ** 2 * 0.035
                  mono = max(-0.92, min(0.92, (pad + bass + lead + kick + swell + rotor) * fade_in * fade_out))
                  left = int(mono * 32767)
                  right = int(mono * 32767 * 0.97)
                  chunk.extend(struct.pack("<hh", left, right))
                  if len(chunk) >= 65536:
                      wav.writeframesraw(chunk)
                      chunk.clear()
              if chunk:
                  wav.writeframesraw(chunk)
          PY

      - name: Assemble cinematic MP4 with title and sound
        run: |
          set -euo pipefail
          mkdir -p output
          audio_input="trailer/audio-generated.wav"
          if [[ -f trailer/audio/music.mp3 ]]; then
            audio_input="trailer/audio/music.mp3"
          fi
          ffmpeg -y             -framerate 24 -start_number 1 -i trailer/frames/frame_%04d.png             -stream_loop -1 -i "$audio_input"             -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='COASTLINE':fontcolor=white:fontsize=76:x=(w-text_w)/2:y=h*0.76:enable='gte(t,13)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='YOUR CITY. YOUR STORY.':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=h*0.86:enable='gte(t,9)',fade=t=out:st=16.8:d=1.2"             -map 0:v:0 -map 1:a:0 -frames:v 432 -t 18             -af "volume=0.9,afade=t=out:st=16.5:d=1.5"             -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p             -c:a aac -b:a 192k -movflags +faststart             output/Coastline-Trailer.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/Coastline-Trailer.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: Coastline-Cinematic-Trailer-MP4
          path: output/Coastline-Trailer.mp4
          if-no-files-found: error
          retention-days: 14
