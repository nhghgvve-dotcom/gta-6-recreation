name: Build Coastline Android Tablet APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Coastline/**'
      - '.github/workflows/build-coastline-mobile.yml'

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Download game character and vehicle assets
        run: |
          mkdir -p Coastline/assets/people Coastline/assets/vehicles
          curl -fL https://models.vinish.dev/people/casual-man.glb -o Coastline/assets/people/casual-man.glb
          curl -fL https://models.vinish.dev/people/casual-woman.glb -o Coastline/assets/people/casual-woman.glb
          curl -fL https://models.vinish.dev/people/business-man.glb -o Coastline/assets/people/business-man.glb
          curl -fL https://models.vinish.dev/people/business-woman.glb -o Coastline/assets/people/business-woman.glb
          curl -fL https://models.vinish.dev/people/construction-worker.glb -o Coastline/assets/people/construction-worker.glb
          curl -fL https://models.vinish.dev/people/doctor.glb -o Coastline/assets/people/doctor.glb
          curl -fL https://models.vinish.dev/people/runner-woman.glb -o Coastline/assets/people/runner.glb
          curl -fL https://grab3d.com/dl/sports-car/sports-car.glb -o Coastline/assets/vehicles/sports-car.glb
          curl -fL "https://files.innerscene.com/library/police-officer-standing-3d-person-emergency-services-9fd93114/5a54c44f2bfc5920ccd2/professional-police-officer.glb" -o Coastline/assets/people/police-officer.glb
          curl -fL "https://shuriken.studio/models/download/6fb5a1fb-25d8-4fdc-9e4b-a605a39f884c" -o Coastline/assets/vehicles/police-helicopter.glb
          cp Coastline/assets/vehicles/sports-car.glb Coastline/assets/vehicles/police-car.glb
          test -s Coastline/assets/vehicles/sports-car.glb

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Disable OpenXR for the Android tablet build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("Coastline/project.godot")
          data = project.read_text()
          old = "[xr]\\nopenxr/enabled=true"
          if old not in data:
              raise SystemExit("Expected OpenXR project setting was not found; refusing an uncertain tablet export.")
          project.write_text(data.replace(old, "[xr]\\nopenxr/enabled=false", 1))
          preset = Path("Coastline/export_presets.cfg").read_text()
          mobile = preset.split('[preset.2.options]', 1)[1]
          assert 'xr_features/xr_mode=0' in mobile
          assert 'plugins/GodotOpenXRMeta=false' in mobile
          assert 'plugins/GodotOpenXRKHR=false' in mobile
          print("Verified: Android tablet export has OpenXR disabled and both OpenXR plugins off.")
          PY

      - name: Import project resources
        run: godot --headless --editor --path Coastline --quit

      - name: Run Android game startup smoke test
        run: |
          set -o pipefail
          godot --headless --path Coastline --quit-after 8 2>&1 | tee /tmp/coastline-android-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/coastline-android-smoke.log; then
            echo "Godot script errors detected."
            exit 1
          fi

      - name: Export standard Android tablet APK
        run: |
          mkdir -p Coastline/build
          godot --verbose --headless --path Coastline --install-android-build-template --export-debug "Android Mobile" "$GITHUB_WORKSPACE/Coastline/build/Coastline-Mobile.apk"

      - name: Verify APK
        run: |
          test -s Coastline/build/Coastline-Mobile.apk
          file Coastline/build/Coastline-Mobile.apk
          unzip -t Coastline/build/Coastline-Mobile.apk | tail -n 2

      - name: Upload Android tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Coastline-3D-Android-Tablet-APK
          path: Coastline/build/Coastline-Mobile.apk
          if-no-files-found: error
